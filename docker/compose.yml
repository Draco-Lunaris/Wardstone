# Wardstone — the PRODUCTION compose bundle.
#
# One image, THREE services, TWO Wardstone processes:
#
#   ws-web — `wardstone ui`: the TLS front door. The FIRST-RUN setup page
#     while no tenant exists, the CA-issued `web-server` leaf afterwards,
#     and the `/api/v1` proxy in every phase. This is the ONLY service
#     that publishes a port to the LAN.
#   ws-api — `wardstone api`: the REST surface, plain HTTP, publishing NO
#     ports. The browser never talks to it directly: ws-web path-proxies
#     `/api/v1/*` to it over the internal compose network (the default
#     `WARDSTONE_API_URL` below is the binary's own default, spelled out
#     so the pairing is visible).
#   db   — the bundled Postgres 18 (the Bundled variant; see docker/
#     README.md for the External variant, which points DATABASE_URL at an
#     existing database and drops this service).
#
# The ui and api processes are deliberately SEPARATE processes with the
# same image and different commands: independently restartable by design
# (the ws-api process keeps serving while the ui process restarts onto a
# re-issued leaf, and vice versa).
#
# Sealed at rest (the shipped volume contract): once the first-run setup
# converts the keys volume, every key lives only in passphrase-sealed
# envelopes and the database credential is rotated at EVERY unlock — no
# long-term secret sits in either service's environment. On a sealed
# volume both processes boot LOCKED: the ui serves its unlock page (and
# /healthz), the api serves /api/v1/healthz and the internal unlock
# endpoint; the master passphrase, entered once at the ui, relays to the
# api and both surfaces resume in place. The healthchecks below are
# LIVENESS by contract — every boot state answers 200 with a state
# field, so a correctly-locked instance is never churned.
#
# Usage:
#
#   WARDSTONE_SERVER_HOSTNAME=ca.example.test \
#   WARDSTONE_DB_PASSWORD=… \
#   docker compose -f docker/compose.yml up -d
#
# The two `:?` variables are REQUIRED by design: without a real hostname
# the setup certificate would serve a placeholder SAN, and without a
# password the bundled Postgres would be guessable.
#
# The image: compose does not build anything in this bundle — the image is
# supplied by the release flow (see "The image and the keys volume" in
# docker/README.md for its contract: the wardstone binary on PATH with NO
# entrypoint (the commands below carry BOTH words, so an ENTRYPOINT would
# double the binary into argv and crash-loop), a non-root run user, and a
# `wardstone`-owned `/var/lib/wardstone/keys`).
# `WARDSTONE_IMAGE` overrides the tag (the e2e harness uses this to point
# at a locally built image):
#
#   WARDSTONE_IMAGE=wardstone:local docker compose -f docker/compose.yml up -d
#
# Rate limiting (the binary's house contract, not a compose knob): per-
# client-IP GCRA covers the credential surfaces the public edge serves.
# In THIS bundle the `ui` process is the edge: ws-web limits the
# `/auth/ui/*` relay routes AND the proxied `POST /api/v1/auth/login` /
# `/api/v1/auth/refresh` pair — so password spraying and TOTP guessing
# stay per-client limited. The `api` process's own auth-route limiter
# keys on its direct TCP peer: every proxied login arrives from ONE
# loopback IP, so it would throttle ALL operators collectively — the
# compose sets `WARDSTONE_AUTH_RATE_LIMIT_DISABLED: "true"` on the `api`
# service below, and the front door carries the per-client limit instead
# (an api-mode switch only; ws-web's limiter ignores it entirely).
# `WARDSTONE_RATE_LIMIT_PER_MILLIS` / `WARDSTONE_RATE_LIMIT_BURST` tune
# BOTH limiters (a direct-API deployment's, and ws-web's front-door one
# in this bundle), overriding the house defaults (one credit per 500 ms,
# burst 20 per IP) — this bundle deliberately sets neither. Positive
# integers only: zero or unparsable values fail the boot loudly, they do
# not disable the limiter.
#
# The ACME surface (`/acme*`, RFC 8555 — certbot) is limited at BOTH
# edges: ws-web runs the per-client-IP GCRA on `POST /acme/<tenant>/new-account`
# (the one unauthenticated mutating endpoint — behind the proxy, ws-api's
# own per-IP keying would collapse into ONE collective bucket), and ws-api
# carries the per-ACCOUNT limiter on every authenticated ACME POST — armed
# ON here, driven by its OWN switch (the bundle does NOT set
# `WARDSTONE_ACME_ACCOUNT_LIMIT_DISABLED`; the auth disable above does not
# reach it, because the ACCOUNT-id keying survives the proxy hop — see
# "The ACME surface" in docker/README.md).

name: wardstone

services:
  ws-web:
    image: ${WARDSTONE_IMAGE:-wardstone:latest}
    container_name: wardstone-ui
    # The restart policy covers the ordinary events — host reboot, crash,
    # image redeploy — and the sealed boot. The first-run setup does NOT
    # self-exit (the resume contract: the listener swaps onto the
    # CA-issued leaf in place and answers `{"resume": true}`), and every
    # later boot starts LOCKED, serving the unlock page until the
    # operator's passphrase. `no` would strand the instance after a
    # reboot.
    restart: unless-stopped
    command: ["wardstone", "ui"]
    environment:
      # The Postgres URL. The ui is the SEEDING consumer: this password —
      # the compose bootstrap credential, the same single
      # WARDSTONE_DB_PASSWORD the `db` service is built from — is read
      # only by the first-run boot, whose setup transaction seeds the
      # tenant. The conversion that ends setup rotates the database
      # role's password, retiring this credential for good; every later
      # ui boot is sealed and substitutes the CURRENT credential from the
      # db-credential envelope into this URL, never reading the env
      # password again. In the Bundled variant it points at the `db`
      # service below; the External variant replaces this with the
      # operator's own database (docker/README.md).
      DATABASE_URL: postgres://wardstone:${WARDSTONE_DB_PASSWORD:?set WARDSTONE_DB_PASSWORD (the bundled Postgres password)}@db:5432/wardstone
      # The keystore directory: master KEK, CA key envelopes, the setup
      # slot, the JWT key pair, and the secret-encryption key file all
      # live under it — the SAME volume for BOTH Wardstone services, so
      # whichever process boots first finds a complete keystore.
      WARDSTONE_KEYS_DIR: /var/lib/wardstone/keys
      # The setup certificate's SAN and the API's domain context. Both
      # Wardstone services read it; a placeholder SAN is a misconfiguration
      # you cannot fix with the API, so an Operator must set it.
      WARDSTONE_SERVER_HOSTNAME: ${WARDSTONE_SERVER_HOSTNAME:?set WARDSTONE_SERVER_HOSTNAME (the certificate SAN, e.g. ca.example.test)}
      # ws-web's proxy target: the api service name on the internal
      # network (the binary's default, spelled out so the pairing of the
      # two services is legible without reading the binary).
      WARDSTONE_API_URL: http://ws-api:8080
      # The api mode's own default bind is 0.0.0.0:8080 to match the
      # WARDSTONE_API_URL default; the ui binds its TLS port. (One
      # variable, per-service values — the binary's contract.)
      WARDSTONE_BIND: 0.0.0.0:8443
    ports:
      # The ONLY published port of the bundle (the Global Constraint: the
      # browser talks to ws-web; ws-api publishes no ports). Bind the host
      # side to a specific interface by editing the left side, e.g.
      # "192.168.1.10:8443:8443".
      - "8443:8443"
    volumes:
      # Named volume so the keys survive `up`/`down`/redeploys. The key
      # FILES are written by the binary itself — the JWT signing key with
      # mode 0600 — and end up owned by the container's non-root user;
      # compose only has to provide the directory (see the image contract
      # in docker/README.md for why the volume starts out usable).
      - wardstone-keys:/var/lib/wardstone/keys
    depends_on:
      db:
        condition: service_healthy
      # Started-before is enough: the proxy answers 502 against a dead
      # upstream, and the ui process is the one operators watch.
      ws-api:
        condition: service_started
    healthcheck:
      # Liveness only (the sealed-at-rest contract): the locked router
      # answers 200 + {"state":"sealed"|"unlocked"} before the unlock,
      # the full door 200 + {"state":"serving"} after — every phase is a
      # healthy phase, so the check must never gate on readiness. `-k`
      # because the serving certificate is always this instance's own
      # (the setup certificate pre-config, the CA-issued leaf after) and
      # never chains to a store curl trusts.
      test: ["CMD", "curl", "-skf", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ws-api:
    image: ${WARDSTONE_IMAGE:-wardstone:latest}
    container_name: wardstone-api
    restart: unless-stopped
    command: ["wardstone", "api"]
    environment:
      # Password-less BY CONTRACT (sealed at rest): no database
      # credential exists in this process's environment at all. The api
      # boots as the sealed shell — on a fresh volume the absent password
      # is itself the boot signal — and the unlock relay (the ui, after
      # the operator's passphrase) opens the db-credential envelope,
      # rotates the role's password, and connects with the fresh value.
      # This URL names only the ROLE and host to authenticate as.
      DATABASE_URL: postgres://wardstone@db:5432/wardstone
      WARDSTONE_KEYS_DIR: /var/lib/wardstone/keys
      WARDSTONE_SERVER_HOSTNAME: ${WARDSTONE_SERVER_HOSTNAME:?set WARDSTONE_SERVER_HOSTNAME (the certificate SAN, e.g. ca.example.test)}
      # No WARDSTONE_API_URL: the api mode has no proxy to point at, and
      # the binary ignores the variable in this mode.
      WARDSTONE_BIND: 0.0.0.0:8080
      # UI logins reach ws-api from one loopback IP (ws-web's proxy), so
      # the per-IP limiter would throttle ALL operators collectively; the
      # front door carries the per-client limit instead — on /auth/ui/*
      # AND the proxied POST /api/v1/auth/login + /api/v1/auth/refresh
      # (password spraying and TOTP guessing are limited at ws-web). The
      # ACME per-account limiter reads a SEPARATE switch
      # (`WARDSTONE_ACME_ACCOUNT_LIMIT_DISABLED`) and stays ON here: the
      # ACCOUNT-id keying survives the proxy hop, so only THIS per-IP
      # limiter needed disabling.
      WARDSTONE_AUTH_RATE_LIMIT_DISABLED: "true"
      # The ACME (RFC 8555) surface's absolute URL base: every URL ws-api
      # builds — the directory address certbot's --server fetches, the
      # nonce/account/order URLs inside it — starts from
      # `{WARDSTONE_PUBLIC_URL}/acme/{tenant}/directory`. The value MUST
      # be the public URL the ACME client actually dials: the OPERATOR's
      # own host of this bundle's TLS front door (ws-web), e.g.
      # `https://wardstone.home.test` — never the internal ws-api
      # address. The default matches the front door published at the
      # standard HTTPS port on WARDSTONE_SERVER_HOSTNAME; when certbot
      # reaches a non-standard port or another public name, override
      # WARDSTONE_PUBLIC_URL to exactly that base (docker/README.md).
      # Unset (a direct-API deployment): the ACME routes degrade to
      # urn:ietf:params:acme:error:serverInternal problem documents.
      WARDSTONE_PUBLIC_URL: ${WARDSTONE_PUBLIC_URL:-https://${WARDSTONE_SERVER_HOSTNAME}}
    # NO `ports:` — intentionally. The REST surface is reachable ONLY over
    # the internal compose network via ws-web's proxy (the Global
    # Constraint). An External deployment that fronts this service with
    # its own reverse proxy adds its own port publishing to ITS copy of
    # this file — see "The External variant" in docker/README.md.
    volumes:
      - wardstone-keys:/var/lib/wardstone/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Liveness only (the sealed-at-rest contract): 200 + {"state":...}
      # in BOTH phases — the sealed shell answers before the unlock, the
      # full REST surface after. Never a readiness gate; a sealed
      # instance is a state, not an outage.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:18-alpine
    container_name: wardstone-db
    restart: unless-stopped
    environment:
      # The credentials the Wardstone services' DATABASE_URL above is
      # built from; the password is the operator's `WARDSTONE_DB_PASSWORD`.
      POSTGRES_USER: wardstone
      POSTGRES_PASSWORD: ${WARDSTONE_DB_PASSWORD:?set WARDSTONE_DB_PASSWORD (the bundled Postgres password)}
      POSTGRES_DB: wardstone
    volumes:
      # PERSISTENT, unlike the dev bundle: this volume holds the CA. It is
      # NOT dropped by a redeploy; `docker compose down` keeps it, and
      # `down -v` would destroy it — never run `down -v` against the
      # production bundle (docker/README.md says what the volume contains
      # and what the keys volume does NOT contain).
      #
      # The mount point is `/var/lib/postgresql`, NOT
      # `/var/lib/postgresql/data`: Postgres 18 moved PGDATA to
      # `/var/lib/postgresql/18/docker` and its entrypoint refuses to
      # start when it finds data at the old path. Mounting the parent
      # directory is what the image's own guidance asks for.
      - wardstone-pgdata:/var/lib/postgresql
    healthcheck:
      # `pg_isready` over TCP, deliberately auth-INDEPENDENT: the sealed
      # world rotates the `wardstone` role's password at every unlock
      # (spec §5.6), so any check authenticating with the compose-known
      # `POSTGRES_PASSWORD` would start failing the moment the first
      # setup commits — and a healthcheck must never depend on a
      # credential the product exists to retire. TCP, not the unix
      # socket: readiness for the services means the final server
      # accepting TCP, which the image's entrypoint only reaches after
      # its init phase (pg_isready against a temporarily-started
      # init server never sees the port). No init scripts ride this
      # bundle, so "accepting connections" on the TCP port IS ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "wardstone", "-d", "wardstone"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    name: wardstone-internal
    driver: bridge

volumes:
  wardstone-keys:
    name: wardstone-keys
  wardstone-pgdata:
    name: wardstone-pgdata
