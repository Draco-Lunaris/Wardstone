# Wardstone — the PRODUCTION compose bundle.
#
# One image, THREE services, TWO Wardstone processes:
#
#   ws-web — `wardstone ui`: the TLS front door. The FIRST-RUN setup page
#     while no tenant exists, the CA-issued `web-server` leaf afterwards,
#     and the `/api/v1` proxy in every phase. This is the ONLY service
#     that publishes a port to the LAN.
#   ws-api — `wardstone api`: the REST surface, plain HTTP, publishing NO
#     ports. The browser never talks to it directly: ws-web path-proxies
#     `/api/v1/*` to it over the internal compose network (the default
#     `WARDSTONE_API_URL` below is the binary's own default, spelled out
#     so the pairing is visible).
#   db   — the bundled Postgres 18 (the Bundled variant; see docker/
#     README.md for the External variant, which points DATABASE_URL at an
#     existing database and drops this service).
#
# The ui and api processes are deliberately SEPARATE processes with the
# same image and different commands: independently restartable by design
# (the ws-api process keeps serving while the ui process restarts onto a
# re-issued leaf, and vice versa).
#
# Sealed at rest (the shipped volume contract): once the first-run setup
# converts the keys volume, every key lives only in passphrase-sealed
# envelopes and the database credential is rotated at EVERY unlock — no
# long-term secret sits in either service's environment. On a sealed
# volume both processes boot LOCKED: the ui serves its unlock page (and
# /healthz), the api serves /api/v1/healthz; the master passphrase,
# entered once at the ui, relays to the api over their shared Unix
# socket and both surfaces resume in place. The healthchecks below are
# LIVENESS by contract — every boot state answers 200 with a state
# field, so a correctly-locked instance is never churned.
#
# Local links over Unix sockets (D8, Task 10): the database traffic
# rides the shared socket at /run/wardstone/pg (the db binds NO TCP
# port), and the unlock relay rides /run/wardstone/relay/relay.sock
# (the api binds it mode 0600 and admits only its own uid —
# SO_PEERCRED; no network listener carries the relay at all). Both
# directories are bind-mounted from the docker HOST's /run (tmpfs,
# RAM-backed), NOT named volumes: compose mounts those PER-CONTAINER,
# so a shared tmpfs volume would silently give each service its own
# private mount. `type: none, o: bind` fails loudly when the host dir
# is absent — the short bind syntax would silently auto-create it as
# root:root. The operator pre-step must therefore run once per HOST
# BOOT (host /run is wiped at reboot — D6 spirit: documented, not
# automated; docker/README.md owns the runbook):
#
#   install -d -m 0770 -o 70 -g 70 /run/wardstone/pg
#   install -d -m 0770 -o 10001 -g 10001 /run/wardstone/relay
#
# postgres (uid 70 in the image) creates the 0770 socket; ui/api
# traverse via group_add. The relay dir belongs to the fixed image
# identity (Dockerfile's uid/gid 10001).
#
# Usage:
#
#   WARDSTONE_SERVER_HOSTNAME=ca.example.test \
#   docker compose -f docker/compose.yml up -d
#
# The `:?` variable is REQUIRED by design: without a real hostname
# the setup certificate would serve a placeholder SAN. There is NO
# password variable at all — the bundled Postgres boots passwordless
# through the peer setup door (the db service below owns the
# bootstrap).
#
# The image: compose does not build anything in this bundle — the image is
# supplied by the release flow (see "The image and the keys volume" in
# docker/README.md for its contract: the wardstone binary on PATH with NO
# entrypoint (the commands below carry BOTH words, so an ENTRYPOINT would
# double the binary into argv and crash-loop), a non-root run user, and a
# `wardstone`-owned `/var/lib/wardstone/keys`).
# `WARDSTONE_IMAGE` overrides the tag (the e2e harness uses this to point
# at a locally built image):
#
#   WARDSTONE_IMAGE=wardstone:local docker compose -f docker/compose.yml up -d
#
# Rate limiting (the binary's house contract, not a compose knob): per-
# client-IP GCRA covers the credential surfaces the public edge serves.
# In THIS bundle the `ui` process is the edge: ws-web limits the
# `/auth/ui/*` relay routes AND the proxied `POST /api/v1/auth/login` /
# `/api/v1/auth/refresh` pair — so password spraying and TOTP guessing
# stay per-client limited. The `api` process's own auth-route limiter
# keys on its direct TCP peer: every proxied login arrives from ONE
# loopback IP, so it would throttle ALL operators collectively — the
# compose sets `WARDSTONE_AUTH_RATE_LIMIT_DISABLED: "true"` on the `api`
# service below, and the front door carries the per-client limit instead
# (an api-mode switch only; ws-web's limiter ignores it entirely).
# `WARDSTONE_RATE_LIMIT_PER_MILLIS` / `WARDSTONE_RATE_LIMIT_BURST` tune
# BOTH limiters (a direct-API deployment's, and ws-web's front-door one
# in this bundle), overriding the house defaults (one credit per 500 ms,
# burst 20 per IP) — this bundle deliberately sets neither. Positive
# integers only: zero or unparsable values fail the boot loudly, they do
# not disable the limiter.
#
# The ACME surface (`/acme*`, RFC 8555 — certbot) is limited at BOTH
# edges: ws-web runs the per-client-IP GCRA on `POST /acme/<tenant>/new-account`
# (the one unauthenticated mutating endpoint — behind the proxy, ws-api's
# own per-IP keying would collapse into ONE collective bucket), and ws-api
# carries the per-ACCOUNT limiter on every authenticated ACME POST — armed
# ON here, driven by its OWN switch (the bundle does NOT set
# `WARDSTONE_ACME_ACCOUNT_LIMIT_DISABLED`; the auth disable above does not
# reach it, because the ACCOUNT-id keying survives the proxy hop — see
# "The ACME surface" in docker/README.md).

name: wardstone

services:
  ws-web:
    image: ${WARDSTONE_IMAGE:-wardstone:latest}
    container_name: wardstone-ui
    # The restart policy covers the ordinary events — host reboot, crash,
    # image redeploy — and the sealed boot. The first-run setup does NOT
    # self-exit (the resume contract: the listener swaps onto the
    # CA-issued leaf in place and answers `{"resume": true}`), and every
    # later boot starts LOCKED, serving the unlock page until the
    # operator's passphrase. `no` would strand the instance after a
    # reboot.
    restart: unless-stopped
    command: ["wardstone", "ui"]
    environment:
      # The Postgres URL, password-less BY CONTRACT (Task 10, ruling
      # 28e): no database credential ever sits in DATABASE_URL. The
      # bundled form's credential story is the peer door: the db
      # service's init script arms the ws_setup role, the FIRST-RUN
      # setup takes the wardstone role over through it (peer
      # authentication over the shared socket), rotates the
      # credential, and seals it into the db-credential envelope —
      # the conversion that ends setup — and every later ui boot
      # substitutes the CURRENT one from that envelope. The
      # socket-host form is the bundled link (D8): local traffic
      # rides /run/wardstone/pg, no TCP; the External variant
      # (docker/README.md) replaces this with the operator's own
      # database, verify-full required. The socket rides the URL's
      # authority percent-encoded: sqlx (and the binary's password
      # splice) cannot parse the libpq empty-host spelling
      # `user@/db?host=/path`, so the percent-encoded form is the
      # one every consumer parses (Task 10 deviation from ruling
      # 28e — same role, database, and socket directory).
      DATABASE_URL: postgres://wardstone@%2Frun%2Fwardstone%2Fpg/wardstone
      # Passed through ONLY so the binary can refuse a stale value
      # loudly (Task 4's gate — an upgraded old bundle's .env may
      # still carry the variable, and the bundled database has no
      # password); the binary never logs the value.
      WARDSTONE_DB_PASSWORD: ${WARDSTONE_DB_PASSWORD:-}
      # The keystore directory: master KEK, CA key envelopes, the setup
      # slot, the JWT key pair, and the secret-encryption key file all
      # live under it — the SAME volume for BOTH Wardstone services, so
      # whichever process boots first finds a complete keystore.
      WARDSTONE_KEYS_DIR: /var/lib/wardstone/keys
      # The setup certificate's SAN and the API's domain context. Both
      # Wardstone services read it; a placeholder SAN is a misconfiguration
      # you cannot fix with the API, so an Operator must set it.
      WARDSTONE_SERVER_HOSTNAME: ${WARDSTONE_SERVER_HOSTNAME:?set WARDSTONE_SERVER_HOSTNAME (the certificate SAN, e.g. ca.example.test)}
      # ws-web's proxy target: the api service name on the internal
      # network (the binary's default, spelled out so the pairing of the
      # two services is legible without reading the binary).
      WARDSTONE_API_URL: http://ws-api:8080
      # The unlock relay's socket (Task 10, D8): the ui's relay DIALS it
      # once the unlock (or the first-run setup commit) succeeds; the
      # api service BINDS the same path. The binary's default, spelled
      # out so the pairing of the two services is legible.
      WARDSTONE_RELAY_SOCKET: /run/wardstone/relay/relay.sock
      # The api mode's own default bind is 0.0.0.0:8080 to match the
      # WARDSTONE_API_URL default; the ui binds its TLS port. (One
      # variable, per-service values — the binary's contract.)
      WARDSTONE_BIND: 0.0.0.0:8443
    ports:
      # The ONLY published port of the bundle (the Global Constraint: the
      # browser talks to ws-web; ws-api publishes no ports). Bind the host
      # side to a specific interface by editing the left side, e.g.
      # "192.168.1.10:8443:8443".
      - "8443:8443"
    volumes:
      # Named volume so the keys survive `up`/`down`/redeploys. The key
      # FILES are written by the binary itself — the JWT signing key with
      # mode 0600 — and end up owned by the container's non-root user;
      # compose only has to provide the directory (see the image contract
      # in docker/README.md for why the volume starts out usable).
      - wardstone-keys:/var/lib/wardstone/keys
      # The shared local links (the header's pre-step owns the host
      # side): the database socket the first-run setup page and every
      # recovery dials, and the unlock relay socket this process's
      # relay dials.
      - ws-pgsock:/run/wardstone/pg
      - ws-relay:/run/wardstone/relay
    # Postgres (uid 70 in the image) owns the socket dir's group: the ui
    # joins it to connect through the 0770 socket (D8's local link).
    group_add: ["70"]
    # The protected-memory arena (ws-secmem) mlocks its pages; the
    # 512 MiB memlock budget is the production pool's ceiling
    # (ws_secmem::PRODUCTION_POOL), granted here rather than assumed.
    ulimits:
      memlock:
        soft: 536870912
        hard: 536870912
    depends_on:
      db:
        condition: service_healthy
      # Started-before is enough: the proxy answers 502 against a dead
      # upstream, and the ui process is the one operators watch.
      ws-api:
        condition: service_started
    healthcheck:
      # Liveness only (the sealed-at-rest contract): the locked router
      # answers 200 + {"state":"sealed"|"unlocked"} before the unlock,
      # the full door 200 + {"state":"serving"} after — every phase is a
      # healthy phase, so the check must never gate on readiness. `-k`
      # because the serving certificate is always this instance's own
      # (the setup certificate pre-config, the CA-issued leaf after) and
      # never chains to a store curl trusts.
      test: ["CMD", "curl", "-skf", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ws-api:
    image: ${WARDSTONE_IMAGE:-wardstone:latest}
    container_name: wardstone-api
    restart: unless-stopped
    command: ["wardstone", "api"]
    environment:
      # Password-less BY CONTRACT (sealed at rest): no database
      # credential exists in this process's environment by design —
      # the one thing that may sit there is an upgraded old bundle's
      # stale `WARDSTONE_DB_PASSWORD`, and it stays only until the
      # boot gate refuses it loudly (the variable below names it). The
      # api boots as the sealed shell, and the unlock relay
      # (the ui, after the operator's passphrase, over the shared
      # socket) opens the db-credential envelope, rotates the
      # role's password, and connects with the fresh value — the
      # bundled form's credential story is the peer door, not a
      # compose-carried credential. This URL names only the ROLE
      # and the local socket to authenticate at (Task 10, ruling
      # 28e: the bundled form — D8's local link, no TCP), with the
      # socket percent-encoded in the authority — the one spelling
      # sqlx parses (see the ui service's DATABASE_URL note).
      DATABASE_URL: postgres://wardstone@%2Frun%2Fwardstone%2Fpg/wardstone
      # Passed through ONLY so the binary can refuse a stale value
      # loudly (Task 4's gate — an upgraded old bundle's .env may
      # still carry the variable, and the bundled database has no
      # password); the binary never logs the value.
      WARDSTONE_DB_PASSWORD: ${WARDSTONE_DB_PASSWORD:-}
      WARDSTONE_KEYS_DIR: /var/lib/wardstone/keys
      WARDSTONE_SERVER_HOSTNAME: ${WARDSTONE_SERVER_HOSTNAME:?set WARDSTONE_SERVER_HOSTNAME (the certificate SAN, e.g. ca.example.test)}
      # No WARDSTONE_API_URL: the api mode has no proxy to point at, and
      # the binary ignores the variable in this mode.
      WARDSTONE_BIND: 0.0.0.0:8080
      # The unlock relay's socket (Task 10, D8): the api BINDS it, mode
      # 0600, and admits only its own uid (SO_PEERCRED) — the ui's relay
      # is the only client. The binary's default, spelled out so the
      # pairing of the two services is legible.
      WARDSTONE_RELAY_SOCKET: /run/wardstone/relay/relay.sock
      # UI logins reach ws-api from one loopback IP (ws-web's proxy), so
      # the per-IP limiter would throttle ALL operators collectively; the
      # front door carries the per-client limit instead — on /auth/ui/*
      # AND the proxied POST /api/v1/auth/login + /api/v1/auth/refresh
      # (password spraying and TOTP guessing are limited at ws-web). The
      # ACME per-account limiter reads a SEPARATE switch
      # (`WARDSTONE_ACME_ACCOUNT_LIMIT_DISABLED`) and stays ON here: the
      # ACCOUNT-id keying survives the proxy hop, so only THIS per-IP
      # limiter needed disabling.
      WARDSTONE_AUTH_RATE_LIMIT_DISABLED: "true"
      # The ACME (RFC 8555) surface's absolute URL base: every URL ws-api
      # builds — the directory address certbot's --server fetches, the
      # nonce/account/order URLs inside it — starts from
      # `{WARDSTONE_PUBLIC_URL}/acme/{tenant}/directory`. The value MUST
      # be the public URL the ACME client actually dials: the OPERATOR's
      # own host of this bundle's TLS front door (ws-web), e.g.
      # `https://wardstone.home.test` — never the internal ws-api
      # address. The default matches the front door published at the
      # standard HTTPS port on WARDSTONE_SERVER_HOSTNAME; when certbot
      # reaches a non-standard port or another public name, override
      # WARDSTONE_PUBLIC_URL to exactly that base (docker/README.md).
      # Unset (a direct-API deployment): the ACME routes degrade to
      # urn:ietf:params:acme:error:serverInternal problem documents.
      WARDSTONE_PUBLIC_URL: ${WARDSTONE_PUBLIC_URL:-https://${WARDSTONE_SERVER_HOSTNAME}}
    # NO `ports:` — intentionally. The REST surface is reachable ONLY over
    # the internal compose network via ws-web's proxy (the Global
    # Constraint). An External deployment that fronts this service with
    # its own reverse proxy adds its own port publishing to ITS copy of
    # this file — see "The External variant" in docker/README.md.
    volumes:
      - wardstone-keys:/var/lib/wardstone/keys
      # The shared local links (the header's pre-step owns the host
      # side): the database socket every unlock-rotated credential
      # connects through, and the relay socket this process binds.
      - ws-pgsock:/run/wardstone/pg
      - ws-relay:/run/wardstone/relay
    # Postgres (uid 70 in the image) owns the socket dir's group: the
    # api joins it to connect through the 0770 socket (D8's local
    # link).
    group_add: ["70"]
    # The protected-memory arena (ws-secmem) mlocks its pages; the
    # 512 MiB memlock budget is the production pool's ceiling
    # (ws_secmem::PRODUCTION_POOL), granted here rather than assumed.
    ulimits:
      memlock:
        soft: 536870912
        hard: 536870912
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Liveness only (the sealed-at-rest contract): 200 + {"state":...}
      # in BOTH phases — the sealed shell answers before the unlock, the
      # full REST surface after. Never a readiness gate; a sealed
      # instance is a state, not an outage.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:18-alpine
    container_name: wardstone-db
    restart: unless-stopped
    # The bundle's db wrapper (mounted into the image's PATH slot
    # below) runs at EVERY container start: it names the fixed uid
    # 10001 as the ws_setup peer identity and bridges the
    # image-default socket path onto the shared directory, then
    # execs the stock entrypoint — docker/postgres/db-entrypoint.sh
    # owns the why.
    entrypoint: ["/usr/local/bin/wardstone-db-entrypoint.sh"]
    environment:
      # The bundled bootstrap contract: POSTGRES_USER/POSTGRES_DB name
      # the role and database the Wardstone services' DATABASE_URL
      # dials, and the entrypoint's init creates them through the
      # wrapper's socket bridge. The wardstone role is born with NO
      # password: the init script below arms the peer-authenticated
      # ws_setup door, and the first-run setup takes the role over
      # through it, rotates the credential, and seals it — no
      # password exists in this file or the environment.
      POSTGRES_USER: wardstone
      POSTGRES_DB: wardstone
      # The trust opt-in stays because it is what passes the official
      # image's minimum-env check without a POSTGRES_PASSWORD — but its
      # trust line never reaches a live server: the image appends it
      # to the hba it generates in PGDATA, and every server in this
      # bundle runs with the pinned hba mounted below (the initdb temp
      # server included — the entrypoint hands pg_ctl the FULL command
      # list, the hba_file flag included), which has zero trust lines
      # and no TCP listener. The real init window is peer-mapped: the
      # pinned hba's recovery line (the container's postgres system
      # user peer-mapped onto the wardstone role) carries the
      # first-boot init — stronger than the trust line the variable
      # was once believed to add.
      POSTGRES_HOST_AUTH_METHOD: trust
    # D8's local link (Task 10): the database binds NO TCP listener at
    # all (listen_addresses is empty) — the only way in is the shared
    # socket at /run/wardstone/pg, mode 0770 so ui/api (group_add'ed to
    # postgres's group) may connect. The pinned hba/ident (mounted
    # read-only at /etc/wardstone below) carry the ws_setup peer door,
    # the app's SCRAM line, and the recovery peer+ident line — and
    # they govern the init phase too: the entrypoint hands pg_ctl the
    # FULL command list (the hba_file and ident_file flags included),
    # so the initdb temp server on a virgin volume reads the SAME
    # pinned hba, and the init script's first-boot dial rides the
    # recovery peer line (db `postgres`, the container's postgres
    # system user peer-mapped onto the wardstone role) — the same
    # line the stock entrypoint's own CREATE DATABASE dials.
    command: postgres -c listen_addresses='' -c unix_socket_directories=/run/wardstone/pg -c unix_socket_permissions=0770 -c hba_file=/etc/wardstone/pg_hba.conf -c ident_file=/etc/wardstone/pg_ident.conf
    volumes:
      # PERSISTENT, unlike the dev bundle: this volume holds the CA. It is
      # NOT dropped by a redeploy; `docker compose down` keeps it, and
      # `down -v` would destroy it — never run `down -v` against the
      # production bundle (docker/README.md says what the volume contains
      # and what the keys volume does NOT contain).
      #
      # The mount point is `/var/lib/postgresql`, NOT
      # `/var/lib/postgresql/data`: Postgres 18 moved PGDATA to
      # `/var/lib/postgresql/18/docker` and its entrypoint refuses to
      # start when it finds data at the old path. Mounting the parent
      # directory is what the image's own guidance asks for.
      - wardstone-pgdata:/var/lib/postgresql
      # The shared socket dir (the header's pre-step owns the host
      # side): the final server creates its socket here.
      - ws-pgsock:/run/wardstone/pg
      # Wardstone's own auth rules, read-only (the command above points
      # postgres at both; docker/postgres/ in the bundle is their home).
      - ./postgres/pg_hba.conf:/etc/wardstone/pg_hba.conf:ro
      - ./postgres/pg_ident.conf:/etc/wardstone/pg_ident.conf:ro
      # The wrapper the entrypoint: line names (every container start)
      # and the init directory the stock entrypoint runs on a virgin
      # volume (first init only) to arm the ws_setup role.
      - ./postgres/db-entrypoint.sh:/usr/local/bin/wardstone-db-entrypoint.sh:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` over the SHARED SOCKET, deliberately auth-INDEPENDENT
      # (the sealed world rotates the `wardstone` role's password at
      # every unlock, spec §5.6, so any check authenticating with a
      # compose-known password would start failing the moment the
      # first setup commits — and a healthcheck must never depend
      # on a credential the product exists to retire). The socket, not
      # TCP: the final server binds NO TCP port (listen_addresses=''
      # above), so the shared socket IS the service's only listener —
      # and the image's entrypoint only starts it after its init
      # phase, so "accepting connections" on the socket means ready.
      test: ["CMD", "pg_isready", "-h", "/run/wardstone/pg"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    name: wardstone-internal
    driver: bridge

volumes:
  wardstone-keys:
    name: wardstone-keys
  wardstone-pgdata:
    name: wardstone-pgdata
  # The shared local links (Task 10, ruling 28a/b): NOT tmpfs-backed
  # named volumes — compose mounts those PER-CONTAINER, so a shared
  # one would silently give each service its own private tmpfs. The
  # backing is a bind mount of a directory on the docker HOST's /run
  # (tmpfs, RAM-backed — G1-consistent, and every container sees the
  # same inodes). `type: none, o: bind` FAILS LOUDLY at `up` when the
  # host dir is absent (the short bind syntax would silently
  # auto-create it as root:root); the header's pre-step owns the
  # creation, and docker/README.md owns the runbook.
  ws-pgsock:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/wardstone/pg
  ws-relay:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/wardstone/relay
