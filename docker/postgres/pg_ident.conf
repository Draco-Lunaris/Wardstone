# Wardstone's pg_ident (Task 10, ruling 28c): the `recovery` map for
# the superuser line in pg_hba.conf. ONLY the postgres→postgres pair
# exists — a peer-auth'd connection runs as the OS user it already is
# (exec -u postgres), so the identity map is the trivial one, and no
# postgres→wardstone mapping is needed: a role-wardstone connection
# matches pg_hba's FIRST line (scram) and never consults a map.

# MAPNAME  SYSTEM-USER  PG-ROLE
recovery   postgres     postgres