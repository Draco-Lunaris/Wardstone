# Wardstone's pg_ident (bundled bootstrap): the `recovery` map for the
# last pg_hba line. `exec -u postgres` peer-resolves to the system
# user postgres, which a POSTGRES_USER=wardstone cluster has no role
# for — the map renames it. ws_setup (uid 10001's peer name) has no
# entry, so the Wardstone containers cannot use the recovery line.
# MAPNAME  SYSTEM-USERNAME  PG-USERNAME
recovery   postgres         wardstone
