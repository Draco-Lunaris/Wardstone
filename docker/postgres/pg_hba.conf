# Wardstone's pg_hba (bundled bootstrap): the bundled Postgres takes
# its traffic ONLY over the shared local socket — the db service binds
# no TCP listener, so there are no `host` lines and nothing is trust.
# First-match order is the whole design: the ws_setup door comes first,
# so the Wardstone containers (uid 10001, named ws_setup in the db
# container's /etc/passwd by the entrypoint wrapper) authenticate peer
# through it; the app's line behind it means a role-wardstone
# connection can only ever present its rotated SCRAM verifier; the
# recovery line last maps the db container's postgres system user onto
# the wardstone role (pg_ident below) — and ws_setup has no map entry,
# so the Wardstone containers can never use the recovery line.
# TYPE  DATABASE   USER       METHOD
local    wardstone  ws_setup   peer
local    wardstone  wardstone  scram-sha-256
local    all        all        peer map=recovery
