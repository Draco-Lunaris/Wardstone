# Wardstone's pg_hba (Task 10, D8): the bundled Postgres takes its
# database traffic ONLY over the shared local socket — the db service
# binds no TCP port at all (listen_addresses=''), so there are no
# `host` lines, and nothing is `trust`.
#
# First-match semantics are the whole design: the app's line comes
# first, so a role-wardstone connection can only ever authenticate
# with its SCRAM verifier (a failure is a REJECT — no fall-through to
# a later line), and the superuser line behind it is peer-auth'd and
# ident-mapped so the D5 recovery runbook
# (`docker compose exec -u postgres db psql` → ALTER ROLE) still
# works. ui/api run as uid 10001 ≠ db's postgres (uid 70), so peer can
# never match them.

# TYPE  DATABASE      USER        ADDRESS  METHOD
local   wardstone     wardstone            scram-sha-256
local   all           postgres             peer map=recovery
