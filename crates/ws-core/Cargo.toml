[package]
name = "ws-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# "ipnet" adds the std::net::IpAddr <-> inet binding (and its array form)
# used by the certificates table's san_ips inet[] column (migration 002).
sqlx = { workspace = true, features = ["macros", "migrate", "uuid", "chrono", "ipnet"] }
# XChaCha20-Poly1305 sealing of small secrets at rest (crypto.rs SecretBox:
# the TOTP/WebAuthn secret-encryption key file); the "zeroize" feature
# wipes the cipher's retained key copy (same features as ws-ca's keystore).
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
# Zeroizing key/plaintext material in SecretBox (key, AEAD output).
zeroize = { workspace = true }
# OS entropy for fresh secret-encryption keys and AEAD nonces (rand 0.10
# SysRng, the house pattern).
rand = { workspace = true }
# jsonb decode/encode for the audit_log details column (migration 003).
# The master-passphrase KEK derivation (KeyEnvelope): argon2id is the
# memory-hard KDF that makes off-box brute force against the sealed
# envelopes meet the unlock-latency budget (~1 s at the shipped params).
# Workspace pin; the same argon2 ws-auth uses for credentials.
argon2 = { workspace = true }
# The envelope file format carries base64 (standard) fields — the same
# encoding idiom as the keystore envelope's JSON.
base64 = { workspace = true }
# Hex encoding of the DB-credential rotation's fresh random bytes (the
# same encoding the opaque token family uses).
hex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# "serde" lets AuditEntry (models/audit.rs) derive Serialize/Deserialize
# over its uuid fields (snake_case DTO pin).
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Audit-entry fixtures (json! macro) in tests/repo_test.rs.
serde_json = { workspace = true }
