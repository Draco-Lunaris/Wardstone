[package]
name = "wardstone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Wardstone binary: `wardstone ui` (the TLS front door) and `wardstone api` (the REST API), one image, two modes"

[dependencies]
# The async runtime: both serving modes are single tokio tasks with a
# possible setup-completion watcher (the workspace pin already carries
# feature `full`).
tokio = { workspace = true }
# Process-level diagnostics: the binary initializes the subscriber.
tracing = { workspace = true }
# The subscriber: fmt + RUST_LOG env filter (workspace pin, `env-filter`
# feature — not a default feature of the crate).
tracing-subscriber = { workspace = true }
# The REST router (api mode) and its serving shape: `axum::serve` with
# `into_make_service_with_connect_info` so the GovernorLayer per-IP key
# extractor sees real peer addresses.
axum = { workspace = true }
# The typed boot error enum (thiserror, the house vocabulary everywhere).
thiserror = { workspace = true }
# PgPool in the boot helpers' signatures; features are unified across the
# workspace (ws-core carries macros/migrate/uuid/chrono/ipnet/json).
sqlx = { workspace = true, features = ["uuid", "chrono", "ipnet"] }
# The domain layer: migrations, pool connect, repos, models.
ws-core = { path = "../ws-core" }
# Authentication primitives: the JWT key pair lifecycle (`load_or_create`).
ws-auth = { path = "../ws-auth" }
# The REST surface: `router(AppState)` and the config vocabulary.
ws-api = { path = "../ws-api" }
# The sealed build closures in both modes return BoxFuture (the unlock
# constructs pools + routers asynchronously).
futures-util = { workspace = true }
# The sealed boot's TLS reload wraps the leaf key's DER as PKCS#8 PEM.
base64 = { workspace = true }
# The TLS front door: `web_router`, `serve_tls`, the setup certificate.
ws-web = { path = "../ws-web" }
# The CA engine: the keystore (setup slot, per-certificate key envelopes).
ws-ca = { path = "../ws-ca" }
# Zeroizing custody for the boot's transient plaintexts (the sealed
# certificate's key, the master bytes on their way into the protected
# arena) — everything the keystore holds long-term is a ws-secmem
# reservation now.
zeroize = { workspace = true }
# The protected arena: the unlocked keystore's master-key custody and
# `resolve_serving_leaf`'s serving-key loader both hold SecretBuf
# reservations.
ws-secmem = { path = "../ws-secmem" }

[dev-dependencies]
# Model ids and the created_at clock for the serving-leaf selection tests
# (workspace pins; the workspace uuid pin carries `v4`).
uuid = { workspace = true }
chrono = { workspace = true }
# The boot tests' process probes: HTTPS against the children's TLS front
# doors — their self-signed first-run/sealed certificates are accepted
# deliberately, the tests assert behavior, not the certificate chain —
# plus plain-HTTP healthz polls of the api child (the workspace pin
# carries rustls-tls + json, so no new features enter the graph).
reqwest = { workspace = true }
# The unlock/healthz JSON bodies those probes send and read.
serde_json = { workspace = true }