[package]
name = "ws-ca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = { workspace = true }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
chrono = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser", "zeroize"] }
rsa = { workspace = true, features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
ws-core = { path = "../ws-core" }
x509-parser = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Recomputes rcgen's legacy deterministic serial for the creation tests'
# serial-number regression pin; production code never digests anything.
sha2 = { workspace = true }
